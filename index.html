<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Boyfriend Questionnaire 💖</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffe6f2;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,105,180,.3);
}

h1{
    text-align:center;
    color:#ff1493;
}

p{
    text-align:center;
    color:#555;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
    color:#ff1493;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:2px solid pink;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:30px;
    background:#ff1493;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#ff69b4;
}

button:disabled{
    background:#ffb3d9;
    cursor:not-allowed;
}

#success{
    display:none;
    text-align:center;
    margin-top:30px;
}

h2{
    color:#ff1493;
    font-size:28px;
}

.reward{
    background:#fff0f6;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    font-size:20px;
    border:3px solid #ff1493;
}

.error{
    color:#ff1493;
    text-align:center;
    margin-top:10px;
    display:none;
    font-weight:bold;
}

.success-text{
    color:#555;
    font-size:18px;
}
</style>

</head>

<body>

<div class="container">

<h1>💗 Official Boyfriend Questionnaire 💗</h1>

<p>Hello handsome! Please answer honestly. 😂❤️</p>

<form id="form">

<label>👤 Full Name</label>
<input type="text" id="fullName" name="full_name" required>

<label>🎂 Age</label>
<input type="number" id="age" name="age" required>

<label>🍕 Favorite Food</label>
<input type="text" id="food" name="favorite_food" required>

<label>♈ Zodiac Sign</label>
<input type="text" id="zodiac" name="zodiac_sign" required>

<label>🙏 Religion</label>
<input type="text" id="religion" name="religion" required>

<label>💼 Career</label>
<input type="text" id="career" name="career" required>

<label>🌟 Future Goals</label>
<textarea id="goals" name="future_goals" rows="4"></textarea>

<label>💖 What do you love most about Grace?</label>
<textarea id="love" name="love_about_grace" rows="4"></textarea>

<label>❤️ Will you continue loving Grace forever?</label>

<select id="forever" name="forever_answer" required>
<option value="">Choose one...</option>
<option>Yes ❤️</option>
<option>Absolutely ❤️❤️</option>
<option>Forever ❤️❤️❤️</option>
</select>

<button type="submit">Submit 💕</button>

<div class="error" id="error"></div>

</form>

<div id="success">

<h2>🎉 Application Submitted! 🎉</h2>

<p class="success-text">Thank you for completing the questionnaire!</p>

<p class="success-text">Status: <strong>Approved ❤️</strong></p>

<div class="reward">
  💋 One Hug & One Kiss Coupon 💋
</div>

</div>

</div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/index.min.js"></script>

<script type="text/javascript">
(function(){
  emailjs.init("uVJq6nZVdIKGZqbvX");
})();

document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();
  
  const button = document.querySelector("button");
  button.disabled = true;
  button.textContent = "Sending... ⏳";
  
  const templateParams = {
    to_email: "gracequince786@gmail.com",
    from_name: document.getElementById("fullName").value,
    full_name: document.getElementById("fullName").value,
    age: document.getElementById("age").value,
    favorite_food: document.getElementById("food").value,
    zodiac_sign: document.getElementById("zodiac").value,
    religion: document.getElementById("religion").value,
    career: document.getElementById("career").value,
    future_goals: document.getElementById("goals").value,
    love_about_grace: document.getElementById("love").value,
    forever_answer: document.getElementById("forever").value
  };

  console.log("Sending with params:", templateParams);

  emailjs.send("service_2ctr2jp", "template_0r167vo", templateParams)
    .then(function(response) {
      console.log('EMAIL SENT!', response.status, response.text);
      document.getElementById("form").style.display="none";
      document.getElementById("success").style.display="block";
    }, function(error) {
      console.log('EMAIL FAILED:', error);
      document.getElementById("error").textContent = "⚠️ Error: " + error.text;
      document.getElementById("error").style.display = "block";
      button.disabled = false;
      button.textContent = "Submit 💕";
    });
});
</script>

</body>
</html>
