<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Boyfriend Questionnaire 💖</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffe6f2;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,105,180,.3);
}

h1{
    text-align:center;
    color:#ff1493;
}

p{
    text-align:center;
    color:#555;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
    color:#ff1493;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:2px solid pink;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:30px;
    background:#ff1493;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff69b4;
}

#success{
    display:none;
    text-align:center;
    margin-top:30px;
}

h2{
    color:#ff1493;
}
</style>

</head>

<body>

<div class="container">

<h1>💗 Official Boyfriend Questionnaire 💗</h1>

<p>Hello handsome! Please answer honestly. 😂❤️</p>

<form id="form" action="https://formsubmit.co/gracequince786@gmail.com" method="POST">

<label>👤 Full Name</label>
<input type="text" name="Full Name" required>

<label>🎂 Age</label>
<input type="number" name="Age" required>

<label>🍕 Favorite Food</label>
<input type="text" name="Favorite Food" required>

<label>♈ Zodiac Sign</label>
<input type="text" name="Zodiac Sign" required>

<label>🙏 Religion</label>
<input type="text" name="Religion" required>

<label>💼 Career</label>
<input type="text" name="Career" required>

<label>🌟 Future Goals</label>
<textarea name="Future Goals" rows="4"></textarea>

<label>💖 What do you love most about Grace?</label>
<textarea name="What do you love most about Grace" rows="4"></textarea>

<label>❤️ Will you continue loving Grace forever?</label>

<select name="Will you continue loving Grace forever" required>
<option>Choose one...</option>
<option>Yes ❤️</option>
<option>Absolutely ❤️❤️</option>
<option>Forever ❤️❤️❤️</option>
</select>

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="https://gracequince786-lang.github.io/Boyfriend-questionnaire-/success.html">

<button type="submit">Submit 💕</button>

</form>

<div id="success">

<h2>🎉 Application Submitted 🎉</h2>

<p>
Thank you for completing the questionnaire!
</p>

<p>
Status:
<strong>Approved ❤️</strong>
</p>

<p>
Reward:
💋 One Hug & One Kiss Coupon
</p>

</div>

</div>

</html>
